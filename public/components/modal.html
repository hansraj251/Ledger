<div
    id="modalOverlay"
    class="fixed inset-0 z-[999] hidden items-center justify-center bg-slate-900/45 p-4 backdrop-blur-sm">

    <div
        class="
            mx-4
            w-[calc(100vw-2rem)]
            max-w-md
            max-h-[90vh]
            overflow-y-auto
            rounded-3xl
            border
            border-indigo-100
            bg-white
            p-5
            shadow-[0_24px_60px_rgba(79,70,229,0.16),0_10px_30px_rgba(124,58,237,0.10)]
            md:w-full
            md:p-6
        ">


        <!-- Header -->

        <div
            class="
                mb-5
                border-b
                border-indigo-100
                pb-4
            ">

            <h2
                id="modalTitle"
                class="
                    text-2xl
                    font-bold
                "
                style="
                    background: linear-gradient(
                        90deg,
                        #c13bbd 0%,
                        #7b3fc6 50%,
                        #2454c7 100%
                    );
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    color: transparent;
                ">

                Modal

            </h2>

        </div>


        <!-- Body -->

        <div
            id="modalBody">

        </div>


        <!-- Footer -->

        <div
            class="
                mt-6
                flex
                justify-end
                gap-3
                border-indigo-100
                pt-5
            ">

            <button
                id="modalCancel"
                class="
                    rounded-xl
                    border
                    border-indigo-100
                    bg-white
                    px-5
                    py-2.5
                    font-medium
                    text-slate-600
                    shadow-sm
                    transition
                    duration-200
                    hover:border-purple-200
                    hover:bg-purple-50
                    hover:text-purple-700
                    hover:shadow-md
                ">

                Cancel

            </button>


            <button
                id="modalSave"
                class="
                    rounded-xl
                    px-5
                    py-2.5
                    font-semibold
                    text-white
                    transition
                    duration-200
                    hover:-translate-y-0.5
                "
                style="
                    background: linear-gradient(
                        90deg,
                        #7b3fc6 0%,
                        #4f46a5 50%,
                        #2454c7 100%
                    );
                    box-shadow:
                        0 8px 20px
                        rgba(79,70,229,0.18);
                ">

                Save

            </button>

        </div>


    </div>

</div>
