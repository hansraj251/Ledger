<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ALIGN Login</title>

<link rel="stylesheet" href="/css/output.css">
<style>

        :root {

            --align-pink:
                #c13bbd;

            --align-purple:
                #7b3fc6;

            --align-indigo:
                #4f46a5;

            --align-blue:
                #2454c7;

            --align-soft:
                #f7f5ff;

        }


        .align-gradient {

            background:
                linear-gradient(
                    90deg,
                    var(--align-pink) 0%,
                    var(--align-purple) 50%,
                    var(--align-blue) 100%
                );

        }


        .align-gradient-text {

            background:
                linear-gradient(
                    90deg,
                    var(--align-pink) 0%,
                    var(--align-purple) 50%,
                    var(--align-blue) 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }


        .align-soft-gradient {

            background:
                linear-gradient(
                    135deg,
                    #fff7ff 0%,
                    #f7f5ff 45%,
                    #eef3ff 100%
                );

        }


        .align-shadow {

            box-shadow:
                0 20px 50px
                rgba(79, 70, 229, 0.10),

                0 8px 24px
                rgba(124, 58, 237, 0.07);

        }


        .align-card {

            border:
                1px solid
                rgba(123, 63, 198, 0.12);

            box-shadow:
                0 8px 25px
                rgba(79, 70, 229, 0.06);

        }


        .align-card:hover {

            border-color:
                rgba(123, 63, 198, 0.22);

            box-shadow:
                0 18px 40px
                rgba(79, 70, 229, 0.12);

        }


        .align-ring {

            box-shadow:
                0 0 0 6px
                rgba(123, 63, 198, 0.08);

        }

    </style>
</head>
<nav
    class="sticky top-0 z-50 border-b border-indigo-100 bg-white/95 shadow-sm backdrop-blur">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

       <a
                href="/index.html"
                class="flex items-center gap-2">

                <img
                    src="/images/logo.png"
                    alt="AlignOS Logo"
                    class="h-10 w-10 object-contain">

                <span
                    class="align-gradient-text text-2xl font-bold">

                    AlignOS

                </span>

            </a>

    </div>

</nav>

<body class="min-h-screen bg-white">

<div class="min-h-screen lg:grid lg:grid-cols-2">

   <!-- Left Branding Panel (Desktop Only) -->
<div class="hidden lg:flex items-center justify-center bg-white">

    <div class="text-center px-10">

        <img
            src="/images/logo.png"
            alt="ALIGN Logo"
            class="mx-auto mb-8 h-80 w-80 object-contain"
            onerror="this.style.display='none';">

        <h1
            class="text-5xl font-bold"
            style="
                background: linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                color: transparent;
            ">

            ALIGN

        </h1>

        <p
            class="mt-4 text-xl font-medium"
            style="color: #4f46a5;">

            Food Business <br>
            School Management

        </p>

    </div>

</div>

    <!-- Login Card -->
    <div class="flex min-h-screen items-center justify-center bg-white p-6">

        <div
    class="w-full max-w-md rounded-3xl border border-indigo-100 bg-white p-8 shadow-2xl"
    style="
        box-shadow:
            0 20px 50px rgba(79, 70, 229, 0.12),
            0 8px 24px rgba(124, 58, 237, 0.08);
    ">

            <!-- Mobile Logo -->
            <div class="mb-8 text-center lg:hidden">

                <img
                    src="/images/logo.png"
                    alt="ALIGN Logo"
                    class="mx-auto mb-4 h-24 w-24 object-contain">

                <h1
    class="text-3xl font-bold"
    style="
        background: linear-gradient(
            90deg,
            #c13bbd 0%,
            #7b3fc6 50%,
            #2454c7 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    ">

    ALIGN

</h1>

<p
    class="mt-2 font-medium"
    style="color: #4f46a5;">

    Food Business <br>
            School Management

</p>

            </div>

            <h2
    class="mb-2 text-3xl font-bold"
    style="
        background: linear-gradient(
            90deg,
            #7b3fc6 0%,
            #4f46a5 50%,
            #2454c7 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    ">

    Welcome Back

</h2>

            <p class="mb-8 text-slate-500">
    Sign in to continue
</p>

            <input
                id="loginId"
                type="text"
                placeholder="Username or Email"
                class="mb-4 w-full rounded-xl border border-gray-300 p-4 text-lg focus:border-blue-600 focus:outline-none">

            <div class="relative mb-6">

    <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full rounded-xl border border-gray-300 p-4 pr-12 text-lg focus:border-blue-600 focus:outline-none">

   <button
    type="button"
    id="togglePassword"
    class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-700">

    <svg
        id="eyeIcon"
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">

        <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/>

        <circle
            cx="12"
            cy="12"
            r="3"/>

    </svg>

</button>

</div>
                <div class="mb-6 flex justify-end">

    <a
        href="/admin/forgotPassword.html"
        class="text-sm font-medium text-blue-600 hover:underline">

        Forgot Password?

    </a>

</div>


            <button
                id="loginBtn"
                class="w-full rounded-xl py-4 text-lg font-semibold text-white transition active:scale-95"
style="
    background: linear-gradient(
        90deg,
        #7b3fc6 0%,
        #4f46a5 50%,
        #2454c7 100%
    );
    box-shadow: 0 8px 20px rgba(79, 70, 229, 0.22);
">

                Login

            </button>

            <div class="mt-6 text-center">

                <span class="text-gray-600">

                    Don't have an account?

                </span>

                <a
                    href="/admin/signup.html"
                    class="ml-1 font-semibold text-blue-600 hover:underline">

                    Create Account

                </a>

            </div>
            <div class="mt-6 border-t pt-4 text-center">

    <a
        href="/admin/support.html"
        class="text-sm font-medium text-blue-600 hover:underline">

        Need help?

    </a> 


</div>

            <div
                id="result"
                class="mt-5 text-center font-medium text-red-600">

            </div>

        </div>

    </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>

</body>

</html>
