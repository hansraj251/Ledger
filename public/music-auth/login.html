<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Align Music Login</title>

<link rel="stylesheet" href="/css/output.css">

<style>

    :root {

        --align-pink:
            #c13bbd;

        --align-purple:
            #7b3fc6;

        --align-indigo:
            #4f46a5;

        --align-blue:
            #2454c7;

        --align-soft:
            #f7f5ff;

    }


    .align-gradient {

        background:
            linear-gradient(
                90deg,
                var(--align-pink) 0%,
                var(--align-purple) 50%,
                var(--align-blue) 100%
            );

    }


    .align-gradient-text {

        background:
            linear-gradient(
                90deg,
                var(--align-pink) 0%,
                var(--align-purple) 50%,
                var(--align-blue) 100%
            );

        -webkit-background-clip:
            text;

        background-clip:
            text;

        -webkit-text-fill-color:
            transparent;

        color:
            transparent;

    }


    .align-soft-gradient {

        background:
            linear-gradient(
                135deg,
                #fff7ff 0%,
                #f7f5ff 45%,
                #eef3ff 100%
            );

    }


    .align-shadow {

        box-shadow:
            0 20px 50px
            rgba(79, 70, 229, 0.10),

            0 8px 24px
            rgba(124, 58, 237, 0.07);

    }


    .align-card {

        border:
            1px solid
            rgba(123, 63, 198, 0.12);

        box-shadow:
            0 8px 25px
            rgba(79, 70, 229, 0.06);

    }


    .align-card:hover {

        border-color:
            rgba(123, 63, 198, 0.22);

        box-shadow:
            0 18px 40px
            rgba(79, 70, 229, 0.12);

    }


    .align-ring {

        box-shadow:
            0 0 0 6px
            rgba(123, 63, 198, 0.08);

    }

</style>

</head>


<body class="min-h-screen bg-white">


<!-- Header -->

<nav
    class="
        sticky
        top-0
        z-50
        border-b
        border-indigo-100
        bg-white/95
        shadow-sm
        backdrop-blur
    "
>

    <div
        class="
            mx-auto
            flex
            max-w-7xl
            items-center
            justify-between
            px-6
            py-4
        "
    >

        <a
            href="/index.html"
            class="
                flex
                items-center
                gap-2
            "
        >

            <img
                src="/images/logo.png"
                alt="AlignOS Logo"
                class="
                    h-10
                    w-10
                    object-contain
                "
            >

            <span
                class="
                    align-gradient-text
                    text-2xl
                    font-bold
                "
            >
                Align
            </span>

        </a>

    </div>

</nav>


<!-- Main -->

<div
    class="
        min-h-screen
        lg:grid
        lg:grid-cols-2
    "
>


    <!-- Left Branding Panel -->

    <div
        class="
            hidden
            items-center
            justify-center
            bg-white
            lg:flex
        "
    >

        <div
            class="
                px-10
                text-center
            "
        >

            <img
                src="/images/logo.png"
                class="
                    h-80
                    w-80
                    object-contain
                "
            >


            <h1
                class="
                    text-4xl
                    font-bold
                "
                style="
                    background:
                        linear-gradient(
                            90deg,
                            #c13bbd 0%,
                            #7b3fc6 50%,
                            #2454c7 100%
                        );

                    -webkit-background-clip:
                        text;

                    background-clip:
                        text;

                    -webkit-text-fill-color:
                        transparent;

                    color:
                        transparent;
                "
            >
                Align Music
            </h1>


    

        </div>

    </div>


    <!-- Login Card -->

    <div
        class="
            flex
            min-h-screen
            items-center
            justify-center
            bg-white
            p-6
        "
    >

        <div
            class="
                w-full
                max-w-md
                rounded-3xl
                border
                border-indigo-100
                bg-white
                p-8
                shadow-2xl
            "
            style="
                box-shadow:
                    0 20px 50px
                    rgba(79, 70, 229, 0.12),

                    0 8px 24px
                    rgba(124, 58, 237, 0.08);
            "
        >


            <!-- Mobile Logo -->

            <div
                class="
                    mb-8
                    text-center
                    lg:hidden
                "
            >

                <img
                    src="/images/logo.png"
                    class="
                        mx-auto
                        mb-4
                        h-24
                        w-24
                        object-contain
                    "
                >


                <h1
                    class="
                        text-3xl
                        font-bold
                    "
                    style="
                        background:
                            linear-gradient(
                                90deg,
                                #c13bbd 0%,
                                #7b3fc6 50%,
                                #2454c7 100%
                            );

                        -webkit-background-clip:
                            text;

                        background-clip:
                            text;

                        -webkit-text-fill-color:
                            transparent;

                        color:
                            transparent;
                    "
                >
                    Align Music
                </h1>


            </div>


            <!-- Heading -->

            <h2
                class="
                    mb-2
                    text-3xl
                    font-bold
                "
                style="
                    background:
                        linear-gradient(
                            90deg,
                            #7b3fc6 0%,
                            #4f46a5 50%,
                            #2454c7 100%
                        );

                    -webkit-background-clip:
                        text;

                    background-clip:
                        text;

                    -webkit-text-fill-color:
                        transparent;

                    color:
                        transparent;
                "
            >
                Welcome Back
            </h2>


            <!-- Login ID -->

            <input
                id="identifier"
                type="text"
                placeholder="Email or Mobile"
                autocomplete="username"
                class="
                    mb-4
                    w-full
                    rounded-xl
                    border
                    border-gray-300
                    p-4
                    text-lg
                    focus:border-blue-600
                    focus:outline-none
                "
            >


            <!-- Password -->

            <div
                class="
                    relative
                    mb-6
                "
            >

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    class="
                        w-full
                        rounded-xl
                        border
                        border-gray-300
                        p-4
                        pr-12
                        text-lg
                        focus:border-blue-600
                        focus:outline-none
                    "
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="
                        absolute
                        right-4
                        top-1/2
                        -translate-y-1/2
                        text-slate-500
                        hover:text-slate-700
                    "
                >

                    <svg
                        id="eyeIcon"
                        xmlns="http://www.w3.org/2000/svg"
                        class="
                            h-5
                            w-5
                        "
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="
                                M1.5 12
                                S5.5 4.5 12 4.5
                                S22.5 12 22.5 12
                                S18.5 19.5 12 19.5
                                S1.5 12 1.5 12z
                            "
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    </svg>

                </button>

            </div>


            <!-- Forgot Password -->

            <div
                class="
                    mb-6
                    flex
                    justify-end
                "
            >

                <a
                    href="/music-auth/forgot-password.html"
                    class="
                        text-sm
                        font-medium
                        text-blue-600
                        hover:underline
                    "
                >
                    Forgot Password?
                </a>

            </div>


            <!-- Login -->

            <button
                id="loginBtn"
                type="button"
                class="
                    w-full
                    rounded-xl
                    py-4
                    text-lg
                    font-semibold
                    text-white
                    transition
                    active:scale-95
                "
                style="
                    background:
                        linear-gradient(
                            90deg,
                            #7b3fc6 0%,
                            #4f46a5 50%,
                            #2454c7 100%
                        );

                    box-shadow:
                        0 8px 20px
                        rgba(79, 70, 229, 0.22);
                "
            >
                Login
            </button>


            <!-- Create Account -->

            <div
                class="
                    mt-6
                    text-center
                "
            >

                <span
                    class="
                        text-gray-600
                    "
                >
                    Don't have an account?
                </span>

                <a
                    href="/music-auth/signup.html"
                    class="
                        ml-1
                        font-semibold
                        text-blue-600
                        hover:underline
                    "
                >
                    Create Account
                </a>

            </div>


            <!-- Continue Without Login -->

            <div
                class="
                    mt-6
                    border-t
                    pt-4
                    text-center
                "
            >

                <a
                    href="/music-index.html"
                    class="
                        text-sm
                        font-medium
                        text-blue-600
                        hover:underline
                    "
                >
                    Continue without Login
                </a>

            </div>


            <!-- Need Help -->

            <div
                class="
                    mt-6
                    border-t
                    pt-4
                    text-center
                "
            >

            </div>


            <!-- Result -->

            <div
                id="result"
                class="
                    mt-5
                    text-center
                    font-medium
                    text-red-600
                "
            >
            </div>


        </div>

    </div>

</div>


<script>

    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    const identifierInput =
        document.getElementById(
            "identifier"
        );


    const passwordInput =
        document.getElementById(
            "password"
        );


    const togglePassword =
        document.getElementById(
            "togglePassword"
        );


    const result =
        document.getElementById(
            "result"
        );


    /*
    |--------------------------------------------------------------------------
    | Password visibility
    |--------------------------------------------------------------------------
    */

    togglePassword.addEventListener(
        "click",
        () => {

            if (
                passwordInput.type ===
                "password"
            ) {

                passwordInput.type =
                    "text";

            }

            else {

                passwordInput.type =
                    "password";

            }

        }
    );


    /*
    |--------------------------------------------------------------------------
    | Login
    |--------------------------------------------------------------------------
    */

    loginBtn.addEventListener(
        "click",
        async () => {

            result.textContent =
                "";


            const identifier =
                identifierInput.value.trim();


            const password =
                passwordInput.value;


            if (
                !identifier ||
                !password
            ) {

                result.textContent =
                    "Email/mobile and password are required";

                return;

            }


            loginBtn.disabled =
                true;

            loginBtn.textContent =
                "Signing in...";


            try {

                const response =
                    await fetch(
                        "/api/property/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    identifier,
                                    password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success ||
                    !data.token
                ) {

                    throw new Error(
                        data.message ||
                        "Invalid email/mobile or password"
                    );

                }


                /*
                |--------------------------------------------------------------------------
                | User session
                |--------------------------------------------------------------------------
                */

                localStorage.setItem(
                    "propertyToken",
                    data.token
                );


                localStorage.setItem(
                    "propertyUser",
                    JSON.stringify(
                        data.user
                    )
                );


                /*
                |--------------------------------------------------------------------------
                | Requested action
                |--------------------------------------------------------------------------
                */

                const params =
                    new URLSearchParams(
                        window.location.search
                    );


                const redirect =
                    params.get(
                        "redirect"
                    );


                window.location.href =
                "/music-index.html";

            }

            catch (error) {

                console.error(
                    "Music login error:",
                    error
                );


                result.textContent =
                    error.message ||
                    "Unable to login";

            }

            finally {

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login";

            }

        }
    );

</script>


</body>

</html>
