<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - AlignOS</title>

    <link rel="stylesheet"
          href="/css/output.css">

    <style>

        :root {
            --align-pink: #c13bbd;
            --align-purple: #7b3fc6;
            --align-indigo: #4f46a5;
            --align-blue: #2454c7;
        }

        .align-gradient-text {

            background:
                linear-gradient(
                    90deg,
                    var(--align-pink) 0%,
                    var(--align-purple) 50%,
                    var(--align-blue) 100%
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

        }

    </style>

</head>


<body class="min-h-screen bg-slate-100">


<!-- Header -->

<nav
    class="sticky top-0 z-50 border-b border-indigo-100 bg-white/95 shadow-sm backdrop-blur">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <a
            href="/index.html"
            class="flex items-center gap-2">

            <img
                src="/images/logo.png"
                alt="AlignOS Logo"
                class="h-10 w-10 object-contain">

            <span
                class="align-gradient-text text-2xl font-bold">

                AlignOS

            </span>

        </a>

    </div>

</nav>


<!-- Main -->

<div class="min-h-screen lg:grid lg:grid-cols-2">


    <!-- Branding -->

    <div
        class="hidden lg:flex items-center justify-center bg-white">

        <div class="px-10 text-center">

            <img
                src="/images/logo.png"
                alt="ALIGN Logo"
                class="mx-auto mb-8 h-80 w-80 object-contain"
                onerror="this.style.display='none';">

            <h1
                class="text-5xl font-bold"
                style="
                    background: linear-gradient(
                        90deg,
                        #c13bbd 0%,
                        #7b3fc6 50%,
                        #2454c7 100%
                    );
                    -webkit-background-clip: text;
                    background-clip: text;
                    -webkit-text-fill-color: transparent;
                    color: transparent;
                ">

                ALIGN

            </h1>

        </div>

    </div>


    <!-- Reset Password -->

    <div
        class="flex min-h-screen items-center justify-center bg-white p-6">

        <div
            class="w-full max-w-md rounded-3xl border border-indigo-100 bg-white p-8"
            style="
                box-shadow:
                    0 20px 50px rgba(79, 70, 229, 0.12),
                    0 8px 24px rgba(124, 58, 237, 0.08);
            ">


            <!-- Mobile Logo -->

            <div class="mb-8 text-center lg:hidden">

                <img
                    src="/images/logo.png"
                    alt="ALIGN Logo"
                    class="mx-auto mb-4 h-24 w-24 object-contain">

                <h1
                    class="align-gradient-text text-3xl font-bold">

                    ALIGN

                </h1>

            </div>


            <!-- Heading -->

            <h2
                class="mb-2 text-3xl font-bold align-gradient-text">

                Reset Password

            </h2>

            <p
                class="mb-8 text-slate-500">

                Enter the OTP sent to your email and
                create a new password.

            </p>


            <!-- Form -->

            <form id="resetPasswordForm">

                <!-- OTP -->

                <label
                    for="otp"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    OTP

                </label>

                <input
                    id="otp"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    autocomplete="one-time-code"
                    placeholder="Enter 6-digit OTP"
                    required
                    class="mb-4 w-full rounded-xl border border-gray-300 p-4 text-lg tracking-widest focus:border-blue-600 focus:outline-none">


                <!-- New Password -->

                <label
                    for="password"
                    class="mb-2 block text-sm font-semibold text-slate-700">

                    New Password

                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    required
                    class="mb-6 w-full rounded-xl border border-gray-300 p-4 text-lg focus:border-blue-600 focus:outline-none">


                <!-- Button -->

                <button
                    id="resetPasswordBtn"
                    type="submit"
                    class="w-full rounded-xl py-4 text-lg font-semibold text-white transition active:scale-95"
                    style="
                        background:
                            linear-gradient(
                                90deg,
                                #7b3fc6 0%,
                                #4f46a5 50%,
                                #2454c7 100%
                            );

                        box-shadow:
                            0 8px 20px
                            rgba(79, 70, 229, 0.22);
                    ">

                    Reset Password

                </button>


            </form>


            <!-- Result -->

            <div
                id="result"
                class="mt-5 text-center font-medium">

            </div>


            <!-- Login -->

            <div
                class="mt-6 text-center text-gray-600">

                Remember your password?

                <a
                    href="/property/login.html"
                    class="font-semibold text-blue-600 hover:underline">

                    Login

                </a>

            </div>


        </div>

    </div>

</div>


<script src="/js/api.js"></script>

<script>

const form =
    document.getElementById(
        "resetPasswordForm"
    );
const email =
    sessionStorage.getItem("resetPasswordEmail");    

const otpInput =
    document.getElementById(
        "otp"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const resetPasswordBtn =
    document.getElementById(
        "resetPasswordBtn"
    );

const result =
    document.getElementById(
        "result"
    );



/*
|--------------------------------------------------------------------------
| Reset Password
|--------------------------------------------------------------------------
*/

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const otp =
            otpInput.value
                .trim();

        const password =
            passwordInput.value;


        result.textContent = "";

        result.className =
            "mt-5 text-center font-medium";


        if (!email) {

            showError(
                "Please enter your email address."
            );

            return;

        }


        if (
            !/^\d{6}$/.test(otp)
        ) {

            showError(
                "Please enter a valid 6-digit OTP."
            );

            return;

        }


        if (
            password.length < 8
        ) {

            showError(
                "Password must be at least 8 characters."
            );

            return;

        }


        resetPasswordBtn.disabled =
            true;

        resetPasswordBtn.textContent =
            "Resetting Password...";


        try {

            const data =
                await API.post(
                    "/api/property/auth/reset-password",
                    {
                        email,
                        otp,
                        password
                    }
                );


            if (
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Unable to reset password."
                );

            }


            result.textContent =
                "Password reset successfully. Redirecting to login...";

            result.classList.add(
                "text-green-600"
            );


            setTimeout(
                function () {

                    window.location.href =
                        "/property/login.html";

                },
                1200
            );


        }
        catch (error) {

            console.error(
                "Property reset password error:",
                error
            );


            showError(
                error.message ||
                "Unable to reset password."
            );


            resetPasswordBtn.disabled =
                false;

            resetPasswordBtn.textContent =
                "Reset Password";

        }

    }
);


/*
|--------------------------------------------------------------------------
| Error
|--------------------------------------------------------------------------
*/

function showError(
    message
) {

    result.textContent =
        message;

    result.className =
        "mt-5 text-center font-medium text-red-600";

}

</script>


</body>

</html>
