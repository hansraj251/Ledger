<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ALIGN Property Signup</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        :root {

            --align-pink: #c13bbd;
            --align-purple: #7b3fc6;
            --align-indigo: #4f46a5;
            --align-blue: #2454c7;
            --align-soft: #f7f5ff;

        }


        .align-gradient {

            background:
                linear-gradient(
                    90deg,
                    var(--align-pink) 0%,
                    var(--align-purple) 50%,
                    var(--align-blue) 100%
                );

        }


        .align-gradient-text {

            background:
                linear-gradient(
                    90deg,
                    var(--align-pink) 0%,
                    var(--align-purple) 50%,
                    var(--align-blue) 100%
                );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

        }


        .align-soft-gradient {

            background:
                linear-gradient(
                    135deg,
                    #fff7ff 0%,
                    #f7f5ff 45%,
                    #eef3ff 100%
                );

        }


        .align-card {

            border:
                1px solid
                rgba(123, 63, 198, 0.12);

            box-shadow:
                0 8px 25px
                rgba(79, 70, 229, 0.06);

        }

    </style>

</head>


<body class="min-h-screen bg-slate-100">


<!-- Navbar -->

<nav
    class="sticky top-0 z-50 border-b border-indigo-100 bg-white/95 shadow-sm backdrop-blur">

    <div
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

        <a
            href="/index.html"
            class="flex items-center gap-2">

            <img
                src="/images/logo.png"
                alt="AlignOS Logo"
                class="h-10 w-10 object-contain">

            <span
                class="align-gradient-text text-2xl font-bold">

                Align

            </span>

        </a>

    </div>

</nav>


<div
    class="min-h-[calc(100vh-73px)] lg:grid lg:grid-cols-2">


    <!-- Left Branding -->

    <div
        class="hidden lg:flex items-center justify-center bg-white">

        <div
            class="px-10 text-center">

            <img
                src="/images/logo.png"
                alt="ALIGN Logo"
                class="mx-auto mb-8 h-80 w-80 object-contain"
                onerror="this.style.display='none';">

            <h1
                class="text-5xl font-bold align-gradient-text">

                ALIGN

            </h1>

            <p
                class="mt-4 text-xl font-medium"
                style="color:#4f46a5;">

                Properties & Services

            </p>

            <p
                class="mx-auto mt-4 max-w-md text-slate-500">

                Buy, sell and rent properties
                with ALIGN.

            </p>

        </div>

    </div>


    <!-- Signup Section -->

    <div
        class="flex min-h-[calc(100vh-73px)] items-center justify-center bg-white p-6">


        <div
            class="align-card w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">


            <!-- Mobile Branding -->

            <div
                class="mb-8 text-center lg:hidden">

                <img
                    src="/images/logo.png"
                    alt="ALIGN Logo"
                    class="mx-auto mb-4 h-24 w-24 object-contain">

                <h1
                    class="align-gradient-text text-3xl font-bold">

                    ALIGN

                </h1>

                <p
                    class="mt-2 font-medium"
                    style="color:#4f46a5;">

                    Properties & Services

                </p>

            </div>


            <!-- Heading -->

            <h2
                class="mb-2 text-3xl font-bold align-gradient-text">

                Create Account

            </h2>

            <p
                class="mb-8 text-slate-500">

                Create your ALIGN property account

            </p>


            <form
                id="signupForm"
                novalidate>


                <!-- Name -->

                <div class="mb-4">

                    <label
                        for="name"
                        class="mb-2 block text-sm font-semibold text-slate-700">

                        Full Name

                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        placeholder="Enter your full name"
                        required
                        class="w-full rounded-xl border border-gray-300 p-4 text-lg outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                </div>


                <!-- Email -->

                <div class="mb-4">

                    <label
                        for="email"
                        class="mb-2 block text-sm font-semibold text-slate-700">

                        Email Address
                    

                    </label>

                    <input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    placeholder="Enter your email address"
    required
    class="w-full rounded-xl border border-gray-300 p-4 text-lg outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                </div>


                <!-- Mobile -->

                <div class="mb-4">

                    <label
                        for="mobile"
                        class="mb-2 block text-sm font-semibold text-slate-700">

                        Mobile Number
                        <span class="font-normal text-slate-400">
                            (optional)
                        </span>

                    </label>

                    <input
                        id="mobile"
                        name="mobile"
                        type="tel"
                        autocomplete="tel"
                        placeholder="Enter your mobile number"
                        class="w-full rounded-xl border border-gray-300 p-4 text-lg outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                </div>


                <!-- Password -->

                <div class="mb-4">

                    <label
                        for="password"
                        class="mb-2 block text-sm font-semibold text-slate-700">

                        Password

                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Minimum 8 characters"
                        required
                        minlength="8"
                        class="w-full rounded-xl border border-gray-300 p-4 text-lg outline-none transition focus:border-blue-600 focus:ring-2 focus:ring-blue-100">

                </div>


                <!-- Button -->

                <button
                    id="signupBtn"
                    type="submit"
                    class="w-full rounded-xl py-4 text-lg font-semibold text-white transition hover:opacity-95 active:scale-95 disabled:cursor-not-allowed disabled:opacity-60"
                    style="
                        background:
                            linear-gradient(
                                90deg,
                                #7b3fc6 0%,
                                #4f46a5 50%,
                                #2454c7 100%
                            );
                        box-shadow:
                            0 8px 20px
                            rgba(79, 70, 229, 0.22);
                    ">

                    Create Account

                </button>


            </form>


            <!-- Login -->

            <div
                class="mt-6 text-center text-gray-600">

                Already have an account?

                <a
                    href="/property/login.html"
                    class="font-semibold text-blue-600 hover:underline">

                    Login

                </a>

            </div>


            <!-- Result -->

            <div
                id="result"
                class="mt-5 text-center font-medium">

            </div>


        </div>

    </div>

</div>


<div id="modalContainer"></div>

<script src="/js/otpModal.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/property/js/signup.js"></script>

<script>
    loadOtpModal();
</script>

</body>

</html>
