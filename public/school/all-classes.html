<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>All Classes</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #f5f7ff 50%,
                    #faf7ff 100%
                );

        }


        .premium-header {

            border-bottom:
                1px solid
                #e0e7ff;

            background:
                rgba(255,255,255,0.96);

            box-shadow:
                0 8px 24px
                rgba(79,70,229,0.07);

            backdrop-filter:
                blur(12px);

        }


        .premium-btn {

            border:
                1px solid
                #e0e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            color:
                #4f46a5;

            box-shadow:
                0 4px 12px
                rgba(79,70,229,0.05);

            transition:
                all 0.2s ease;

        }


        .premium-btn:hover {

            border-color:
                #c4b5fd;

            background:
                linear-gradient(
                    90deg,
                    #fff7ff 0%,
                    #f5efff 50%,
                    #eef3ff 100%
                );

            color:
                #7b3fc6;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79,70,229,0.10);

        }


        .logout-btn {

            background:
                linear-gradient(
                    90deg,
                    #7b3fc6 0%,
                    #4f46a5 50%,
                    #2454c7 100%
                );

            color:
                white;

            box-shadow:
                0 8px 20px
                rgba(79,70,229,0.18);

            transition:
                all 0.2s ease;

        }


        .logout-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 12px 25px
                rgba(79,70,229,0.24);

        }


        .premium-title {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }


        .premium-class-card {

            position:
                relative;

            overflow:
                hidden;

            border:
                1px solid
                #e0e7ff;

            border-radius:
                18px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            box-shadow:
                0 10px 28px
                rgba(79,70,229,0.07);

            transition:
                all 0.2s ease;

        }


        .premium-class-card::before {

            content:
                "";

            position:
                absolute;

            left:
                0;

            top:
                0;

            bottom:
                0;

            width:
                4px;

            background:
                linear-gradient(
                    to bottom,
                    #c13bbd,
                    #7b3fc6,
                    #2454c7
                );

        }


        .premium-class-card:hover {

            border-color:
                #c4b5fd;

            transform:
                translateY(-3px);

            box-shadow:
                0 16px 35px
                rgba(79,70,229,0.12);

        }

    </style>

</head>


<body
    class="min-h-screen">


<main
    class="min-h-screen">


    <!-- Header -->

    <header
        class="
            premium-header
            sticky
            top-0
            z-50
        ">

        <div
            class="
                mx-auto
                flex
                max-w-7xl
                items-center
                px-6
                py-4
            ">


            <button
                id="backBtn"
                type="button"
                onclick="history.back()"
                class="
                    premium-btn
                    flex
                    items-center
                    gap-2
                    rounded-xl
                    px-4
                    py-2
                    text-sm
                    font-semibold
                ">

                <span
                    class="text-lg">

                    ←

                </span>

                Back

            </button>


            <button
                id="logoutBtn"
                type="button"
                class="
                    logout-btn
                    ml-auto
                    hidden
                    rounded-xl
                    px-4
                    py-2
                    text-sm
                    font-semibold
                ">

                Logout

            </button>


        </div>

    </header>


    <!-- Content -->

    <section
        class="
            mx-auto
            max-w-7xl
            px-6
            py-8
        ">


        <!-- Heading -->

        <div
            class="
                mb-7
                border-b
                border-indigo-100
                pb-6
            ">

            <p
                class="
                    mb-1
                    text-sm
                    font-semibold
                    uppercase
                    tracking-wider
                    text-indigo-500
                ">

                Academic Overview

            </p>


            <h1
                class="
                    premium-title
                    text-3xl
                    font-bold
                    md:text-4xl
                ">

                All Classes

            </h1>


            <p
                id="classesSummary"
                class="
                    mt-2
                    text-sm
                    text-slate-500
                    md:text-base
                ">

                Loading classes...

            </p>

        </div>


        <!-- Classes -->

        <div
            id="classesGrid"
            class="
                grid
                gap-5
                sm:grid-cols-2
                lg:grid-cols-3
                xl:grid-cols-4
            ">


            <div
                class="
                    premium-class-card
                    p-6
                    text-center
                ">

                <p
                    class="
                        text-sm
                        font-medium
                        text-slate-500
                    ">

                    Loading classes...

                </p>

            </div>


        </div>


    </section>


</main>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/allClasses.js"></script>


</body>

</html>
