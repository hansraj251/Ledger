<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Attendance</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #f5f7ff 50%,
                    #faf7ff 100%
                );

        }


        .premium-header {

            border-bottom:
                1px solid
                #e0e7ff;

            background:
                rgba(255,255,255,0.96);

            box-shadow:
                0 8px 24px
                rgba(79,70,229,0.07);

            backdrop-filter:
                blur(12px);

        }


        .premium-title {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }


        .premium-btn {

            border:
                1px solid
                #e0e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            color:
                #4f46a5;

            box-shadow:
                0 4px 12px
                rgba(79,70,229,0.05);

            transition:
                all 0.2s ease;

        }


        .premium-btn:hover {

            border-color:
                #c4b5fd;

            background:
                linear-gradient(
                    90deg,
                    #fff7ff 0%,
                    #f5efff 50%,
                    #eef3ff 100%
                );

            color:
                #7b3fc6;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79,70,229,0.10);

        }


        .premium-input {

            border:
                1px solid
                #ddd6fe;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf7ff
                );

            box-shadow:
                0 3px 10px
                rgba(79,70,229,0.04);

            transition:
                all 0.2s ease;

        }


        .premium-input:focus {

            border-color:
                #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.12);

            outline:
                none;

        }


        .holiday-btn {

            background:
                linear-gradient(
                    90deg,
                    #f59e0b,
                    #d97706
                );

            box-shadow:
                0 6px 16px
                rgba(245,158,11,0.18);

            transition:
                all 0.2s ease;

        }


        .holiday-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 9px 20px
                rgba(245,158,11,0.24);

        }


        .present-btn {

            background:
                linear-gradient(
                    90deg,
                    #059669,
                    #047857
                );

            box-shadow:
                0 6px 16px
                rgba(5,150,105,0.18);

            transition:
                all 0.2s ease;

        }


        .present-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 9px 20px
                rgba(5,150,105,0.24);

        }


        .attendance-panel {

            border:
                1px solid
                #e0e7ff;

            background:
                rgba(255,255,255,0.97);

            box-shadow:
                0 12px 30px
                rgba(79,70,229,0.07);

        }


        .attendance-panel-header {

            border-bottom:
                1px solid
                #e9e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #faf7ff,
                    #f5f7ff
                );

        }


        .attendance-table thead {

            background:
                linear-gradient(
                    90deg,
                    #faf7ff,
                    #f5f7ff
                );

        }


        .attendance-table tbody tr {

            border-top:
                1px solid
                #eef2ff;

            transition:
                all 0.2s ease;

        }


        .attendance-table tbody tr:hover {

            background:
                linear-gradient(
                    90deg,
                    #fffaff,
                    #f8f7ff,
                    #f5f7ff
                );

        }

    </style>

</head>


<body class="min-h-screen">


<main class="min-h-screen">


    <!-- Header -->

    <header
        class="premium-header sticky top-0 z-50">

        <div
            class="
                mx-auto
                flex
                w-full
                max-w-7xl
                flex-wrap
                items-center
                gap-2
                px-4
                py-3
                sm:flex-nowrap
                sm:justify-between
                sm:gap-4
                sm:px-6
                sm:py-4
            ">


            <!-- Back / Page Info -->

            <div
                class="
                    flex
                    min-w-0
                    shrink-0
                    items-center
                    gap-2
                    sm:gap-4
                ">

                <button
                    type="button"
                    onclick="history.back()"
                    class="
                        premium-btn
                        flex
                        min-w-[72px]
                        shrink-0
                        items-center
                        justify-center
                        gap-1.5
                        whitespace-nowrap
                        rounded-xl
                        px-3
                        py-2
                        text-xs
                        font-semibold
                        sm:min-w-0
                        sm:gap-2
                        sm:px-4
                        sm:py-2.5
                        sm:text-sm
                    ">

                    <span
                        class="text-base">

                        ←

                    </span>

                    Back

                </button>


                <div
                    class="
                        hidden
                        h-8
                        w-px
                        bg-indigo-100
                        sm:block
                    ">
                </div>


                <div
                    class="hidden min-w-0 sm:block">

                    <p
                        class="
                            text-xs
                            font-semibold
                            uppercase
                            tracking-wider
                            text-indigo-500
                        ">

                        Attendance Management

                    </p>

                    <p
                        class="
                            mt-0.5
                            text-sm
                            text-slate-500
                        ">

                        Mark daily student attendance

                    </p>

                </div>

            </div>


            <!-- Search / Date -->

            <div
                class="
                    flex
                    min-w-0
                    flex-1
                    items-center
                    gap-2
                    sm:flex-none
                ">


                <div
                    class="min-w-0 flex-1 sm:flex-none">

                    <label
                        for="studentSearch"
                        class="sr-only">

                        Search Student

                    </label>

                    <input
                        id="studentSearch"
                        type="search"
                        placeholder="Search student..."
                        autocomplete="off"
                        class="
                            premium-input
                            w-full
                            min-w-0
                            rounded-xl
                            px-3
                            py-2
                            text-sm
                            text-slate-700
                            placeholder:text-slate-400
                            sm:w-52
                        ">

                </div>


                <div
                    id="attendanceDateContainer"
                    class="shrink-0">

                    <label
                        for="attendanceDate"
                        class="sr-only">

                        Attendance Date

                    </label>

                    <input
                        id="attendanceDate"
                        type="date"
                        max=""
                        class="
                            premium-input
                            w-[125px]
                            rounded-xl
                            px-2.5
                            py-2
                            text-sm
                            text-slate-700
                            sm:w-auto
                            sm:px-3
                        ">

                </div>

            </div>


            <!-- Actions -->

            <div
                class="
                    flex
                    w-full
                    shrink-0
                    items-center
                    gap-2
                    sm:w-auto
                ">

                <button
                    id="holidayBtn"
                    type="button"
                    class="
                        holiday-btn
                        flex
                        flex-1
                        items-center
                        justify-center
                        whitespace-nowrap
                        rounded-xl
                        px-3
                        py-2
                        text-xs
                        font-semibold
                        text-white
                        sm:flex-none
                        sm:px-4
                        sm:text-sm
                    ">

                    Mark Holiday

                </button>


                <button
                    id="markAllPresentBtn"
                    type="button"
                    class="
                        present-btn
                        flex
                        flex-1
                        items-center
                        justify-center
                        whitespace-nowrap
                        rounded-xl
                        px-3
                        py-2
                        text-xs
                        font-semibold
                        text-white
                        sm:flex-none
                        sm:px-4
                        sm:text-sm
                    ">

                    Mark All Present

                </button>

            </div>

        </div>

    </header>


    <!-- Content -->

    <section
        class="
            mx-auto
            w-full
            max-w-7xl
            px-4
            py-4
            sm:px-6
            sm:py-8
        ">


        <p
            id="attendanceResult"
            class="
                mb-4
                text-sm
                font-medium
            ">

        </p>


        <!-- Attendance Panel -->

        <div
            class="
                attendance-panel
                overflow-hidden
                rounded-2xl
            ">


            <!-- Panel Header -->

            <div
                class="
                    attendance-panel-header
                    px-4
                    py-4
                    sm:px-6
                ">

                <div
                    class="
                        flex
                        flex-wrap
                        items-center
                        justify-between
                        gap-3
                    ">

                    <div>

                        <p
                            class="
                                text-xs
                                font-semibold
                                uppercase
                                tracking-wider
                                text-indigo-500
                            ">

                            Student Register

                        </p>

                        <h1
                            class="
                                premium-title
                                mt-1
                                text-xl
                                font-bold
                                sm:text-2xl
                            ">

                            Daily Attendance

                        </h1>

                    </div>


                    <div
                        class="
                            rounded-xl
                            border
                            border-indigo-100
                            bg-white
                            px-3
                            py-2
                            shadow-sm
                        ">

                        <p
                            id="attendanceSummary"
                            class="
                                text-sm
                                font-medium
                                text-slate-500
                            ">

                            Loading students...

                        </p>

                    </div>

                </div>

            </div>


            <!-- Table -->

            <div
                class="w-full overflow-x-auto">

                <table
                    class="
                        attendance-table
                        min-w-[520px]
                        w-full
                    ">


                    <thead>

                        <tr>

                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                ">

                                Student

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                ">

                                Class / Section

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-center
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                ">

                                Attendance

                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="attendanceStudentTableBody">

                        <tr>

                            <td
                                colspan="4"
                                class="
                                    px-4
                                    py-10
                                    text-center
                                    text-sm
                                    text-slate-500
                                    sm:px-6
                                ">

                                Loading students...

                            </td>

                        </tr>

                    </tbody>


                </table>

            </div>


        </div>


    </section>


</main>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/attendance.js"></script>


</body>

</html>
