<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Classes</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #f5f7ff 50%,
                    #faf7ff 100%
                );

        }


        .premium-header {

            border-bottom:
                1px solid
                #e0e7ff;

            background:
                rgba(255, 255, 255, 0.96);

            box-shadow:
                0 8px 24px
                rgba(79, 70, 229, 0.07);

            backdrop-filter:
                blur(12px);

        }


        .premium-title {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }


        .premium-btn {

            border:
                1px solid
                #e0e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            color:
                #4f46a5;

            box-shadow:
                0 4px 12px
                rgba(79, 70, 229, 0.05);

            transition:
                all 0.2s ease;

        }


        .premium-btn:hover {

            border-color:
                #c4b5fd;

            background:
                linear-gradient(
                    90deg,
                    #fff7ff 0%,
                    #f5efff 50%,
                    #eef3ff 100%
                );

            color:
                #7b3fc6;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.10);

        }


        .add-class-btn {

            background:
                linear-gradient(
                    90deg,
                    #7b3fc6,
                    #2454c7
                );

            box-shadow:
                0 7px 18px
                rgba(79, 70, 229, 0.20);

            transition:
                all 0.2s ease;

        }


        .add-class-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 24px
                rgba(79, 70, 229, 0.27);

        }


        .premium-panel {

            border:
                1px solid
                #e0e7ff;

            background:
                rgba(255, 255, 255, 0.97);

            box-shadow:
                0 12px 30px
                rgba(79, 70, 229, 0.07);

        }


        .premium-input {

            border:
                1px solid
                #ddd6fe;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf7ff
                );

            box-shadow:
                0 3px 10px
                rgba(79, 70, 229, 0.04);

            transition:
                all 0.2s ease;

        }


        .premium-input:focus {

            border-color:
                #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139, 92, 246, 0.12);

            outline:
                none;

        }


        .table-panel {

            overflow:
                hidden;

            border:
                1px solid
                #e0e7ff;

            background:
                rgba(255, 255, 255, 0.98);

            box-shadow:
                0 12px 30px
                rgba(79, 70, 229, 0.07);

        }


        .table-heading {

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #faf7ff,
                    #f5f7ff
                );

            border-bottom:
                1px solid
                #e9e7ff;

        }


        .classes-table thead {

            background:
                linear-gradient(
                    90deg,
                    #faf7ff,
                    #f5f7ff
                );

        }


        .classes-table tbody tr {

            border-top:
                1px solid
                #eef2ff;

            transition:
                background 0.2s ease;

        }


        .classes-table tbody tr:hover {

            background:
                linear-gradient(
                    90deg,
                    #fffaff,
                    #f8f7ff,
                    #f5f7ff
                );

        }


        .form-divider {

            border-bottom:
                1px solid
                #eeeaff;

        }


        .save-btn {

            background:
                linear-gradient(
                    90deg,
                    #7b3fc6,
                    #2454c7
                );

            box-shadow:
                0 6px 16px
                rgba(79, 70, 229, 0.18);

            transition:
                all 0.2s ease;

        }


        .save-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 9px 20px
                rgba(79, 70, 229, 0.24);

        }


        .cancel-btn {

            border:
                1px solid
                #e0e7ff;

            background:
                #f8f7ff;

            color:
                #475569;

            transition:
                all 0.2s ease;

        }


        .cancel-btn:hover {

            background:
                #eef3ff;

            border-color:
                #c4b5fd;

        }
        #classForm {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(5px);
}

#classForm:not(.hidden) {
    display: flex;
}

#classForm .class-modal-content {
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 1rem;
}

@media (max-width: 640px) {

    #classForm {
        padding: 0.75rem;
    }

    #classForm .class-modal-content {
        max-height: 92vh;
    }

}

    </style>

</head>


<body class="min-h-screen">


<main class="min-h-screen">


    <!-- Header -->

    <header
        class="premium-header sticky top-0 z-50">

        <div
            class="
                mx-auto
                flex
                min-h-[60px]
                w-full
                max-w-7xl
                items-center
                justify-between
                gap-3
                px-4
                py-3
                sm:min-h-[72px]
                sm:px-6
                sm:py-4
            ">


            <button
                id="backBtn"
                type="button"
                class="
                    premium-btn
                    shrink-0
                    rounded-xl
                    px-3
                    py-2
                    text-sm
                    font-semibold
                    sm:px-4
                    sm:py-2.5
                ">

                ← Back

            </button>


            <div
                class="hidden min-w-0 text-center sm:block">

                <p
                    class="
                        text-xs
                        font-semibold
                        uppercase
                        tracking-wider
                        text-indigo-500
                    ">

                    School Management

                </p>

                <h1
                    class="
                        premium-title
                        mt-0.5
                        text-xl
                        font-bold
                    ">

                    Classes & Sections

                </h1>

            </div>


            <button
                id="addClassBtn"
                type="button"
                class="
                    add-class-btn
                    shrink-0
                    rounded-xl
                    px-3
                    py-2
                    text-sm
                    font-semibold
                    text-white
                    sm:px-5
                    sm:py-3
                ">

                + Add Class

            </button>

        </div>

    </header>


    <!-- Content -->

    <section
        class="
            mx-auto
            w-full
            max-w-7xl
            px-4
            py-5
            sm:px-6
            sm:py-8
        ">


        <!-- Form -->

       <div
    id="classForm"
    class="hidden">

    <div
        class="class-modal-content premium-panel rounded-2xl p-4 sm:p-6">

            <div
                class="
                    form-divider
                    mb-5
                    flex
                    items-center
                    justify-between
                    pb-4
                ">

                <div>

                    <h2
                        id="classFormTitle"
                        class="
                            mt-1
                            text-lg
                            font-bold
                            text-slate-800
                            sm:text-xl
                        ">

                        Add Class

                    </h2>

                </div>


                <button
                    id="closeFormBtn"
                    type="button"
                    class="
                        flex
                        h-9
                        w-9
                        shrink-0
                        items-center
                        justify-center
                        rounded-xl
                        text-2xl
                        leading-none
                        text-slate-400
                        transition
                        hover:bg-purple-50
                        hover:text-purple-600
                    ">

                    &times;

                </button>

            </div>


            <form
                id="classFormElement">


                <div
                    class="
                        grid
                        grid-cols-1
                        gap-4
                        sm:gap-5
                        md:grid-cols-2
                    ">


                    <div>

                        <label
                            class="
                                mb-2
                                block
                                text-sm
                                font-semibold
                                text-slate-700
                            ">

                            Class

                        </label>

                        <input
                            id="className"
                            type="text"
                            required
                            class="
                                premium-input
                                w-full
                                rounded-xl
                                px-4
                                py-3
                                text-slate-700
                            "
                            placeholder="e.g. 5">

                    </div>


                    <div>

                        <label
                            class="
                                mb-2
                                block
                                text-sm
                                font-semibold
                                text-slate-700
                            ">

                            Section

                        </label>

                        <input
                            id="section"
                            type="text"
                            required
                            class="
                                premium-input
                                w-full
                                rounded-xl
                                px-4
                                py-3
                                text-slate-700
                            "
                            placeholder="e.g. A">

                    </div>

                </div>


                <p
                    id="formResult"
                    class="
                        mt-4
                        break-words
                        text-sm
                        font-medium
                    ">
                </p>


                <div
                    class="
                        mt-5
                        flex
                        flex-col-reverse
                        gap-3
                        border-slate-100
                        pt-5
                        sm:flex-row
                        sm:justify-end
                    ">

                    <button
                        id="cancelFormBtn"
                        type="button"
                        class="
                            cancel-btn
                            w-full
                            rounded-xl
                            px-5
                            py-3
                            text-center
                            font-semibold
                            sm:w-auto
                        ">

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="
                            save-btn
                            w-full
                            rounded-xl
                            px-5
                            py-3
                            text-center
                            font-semibold
                            text-white
                            sm:w-auto
                        ">

                        Save Class

                    </button>

                </div>

            </form>
            </div>

        </div>


        <!-- Classes Table -->

        <div
            class="table-panel rounded-2xl">


            <div
                class="
                    table-heading
                    px-4
                    py-4
                    sm:px-6
                    sm:py-5
                ">

                <div
                    class="
                        flex
                        flex-wrap
                        items-center
                        justify-between
                        gap-2
                    ">

                    <div>

                        <h3
                            class="
                                mt-1
                                text-base
                                font-bold
                                text-slate-800
                                sm:text-lg
                            ">

                            Classes & Sections

                        </h3>

                    </div>

                </div>

            </div>


            <div
                class="overflow-x-auto">

                <table
                    class="
                        classes-table
                        min-w-full
                        text-left
                    ">

                    <thead>

                        <tr
                            class="align-middle">

                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                    sm:py-4
                                ">

                                #

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                    sm:py-4
                                ">

                                Class

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                    sm:py-4
                                ">

                                Section

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                    sm:py-4
                                ">

                                Status

                            </th>


                            <th
                                class="
                                    whitespace-nowrap
                                    px-3
                                    py-3
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                    sm:px-6
                                    sm:py-4
                                ">

                                Actions

                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="classesTableBody">

                        <tr>

                            <td
                                colspan="5"
                                class="
                                    px-4
                                    py-10
                                    text-center
                                    text-sm
                                    text-slate-500
                                    sm:px-6
                                ">

                                Loading classes...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </section>

</main>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/classes.js"></script>


<script>

document.getElementById(
    "backBtn"
).addEventListener(
    "click",
    () => {

        window.location.href =
            "/school/dashboard.html";

    }
);

</script>


</body>

</html>
