<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>School Dashboard</title>

    <link
        rel="stylesheet"
        href="/css/output.css">
    <style>

.school-nav-item {

    border-color:
        #e5e7eb;

    background:
        linear-gradient(
            90deg,
            #ffffff 0%,
            #faf7ff 50%,
            #f5f7ff 100%
        );

    transition:
        all 0.2s ease;

}

.school-nav-item:hover {

    border-color:
        #c4b5fd;

    background:
        linear-gradient(
            90deg,
            #fff7ff 0%,
            #f5efff 50%,
            #eef3ff 100%
        );

    color:
        #7b3fc6;

    transform:
        translateY(-1px);

    box-shadow:
        0 8px 20px
        rgba(79, 70, 229, 0.10);

}

</style>  
<style>

.school-stat-card {

    border-color:
        #e5e7eb;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #faf7ff 55%,
            #f5f7ff 100%
        );

    box-shadow:
        0 12px 30px
        rgba(79, 70, 229, 0.08),
        0 4px 12px
        rgba(124, 58, 237, 0.05);

    transition:
        all 0.2s ease;

}

.school-stat-card:hover {

    border-color:
        #c4b5fd;

    background:
        linear-gradient(
            135deg,
            #fffaff 0%,
            #f7f0ff 55%,
            #eef3ff 100%
        );

    transform:
        translateY(-3px);

    box-shadow:
        0 18px 35px
        rgba(79, 70, 229, 0.13),
        0 6px 16px
        rgba(124, 58, 237, 0.08);

}

.school-stat-number {

    background:
        linear-gradient(
            90deg,
            #c13bbd 0%,
            #7b3fc6 50%,
            #2454c7 100%
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

    color:
        transparent;

}

</style>  

</head>

<body class="bg-slate-100">

    <div class="flex h-screen flex-col">

        <!-- Mobile Header -->

                class="rounded-lg bg-slate-100 px-3 py-2 text-slate-700 hover:bg-slate-200">

                ☰

        </header>


        <!-- Sidebar Overlay -->

            class="fixed inset-0 z-40 hidden bg-black/50 md:hidden">
        </div>


        <div class="flex h-screen overflow-hidden">


            <!-- Sidebar -->

                id="sidebar"
                class="fixed left-0 top-0 z-50 flex h-screen w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-300 md:static md:translate-x-0">

                <!-- Sidebar Header -->

        <div

style="
    box-shadow:
        0 12px 30px rgba(79, 70, 229, 0.10),
        0 4px 12px rgba(124, 58, 237, 0.06);
">

    <img
        id="sidebarSchoolLogo"
        src=""
        alt=""

        onerror="
            this.classList.add('hidden');
        ">

</div>

        <button
            id="closeSidebarBtn"
            type="button"
            class="absolute right-0 rounded-lg bg-slate-100 px-2 py-1 text-slate-500 hover:bg-slate-200 md:hidden">

            ✕

        </button>

    </div>

</div>


               <!-- Navigation -->

</nav>

                </div>

            </aside>

     <div

                    <div

<a

</a>
<a
    href="/school/pending-salary.html"

    <p
        class="text-sm font-medium text-slate-500">

        Pending Salaries

    </p>

    <p
    id="pendingSalaries"
    class="school-stat-number mt-3 text-2xl font-bold md:text-3xl">

        ₹0

    </p>

</a>
                        <a
                           href="/school/studentDetails.html"
                            class="school-stat-card block rounded-2xl p-4 md:p-5 xl:p-6">
                            <p
                                class="text-sm font-medium text-slate-500">

                                Students

                            </p>
                            <p
                                id="studentsCount"
                                class="school-stat-number mt-3 text-2xl font-bold md:text-3xl">

                                0

                            </p>

                        </a>


                        <!-- Teachers -->

                        <a
                            href="/school/teachers.html"
                            class="school-stat-card block rounded-2xl p-4 md:p-5 xl:p-6">
                            <p
                                class="text-sm font-medium text-slate-500">

                                Staff

                            </p>

                            <p
                                 id="staffCount"
                                class="school-stat-number mt-3 text-2xl font-bold md:text-3xl">

                                0

                            </p>

                        </a>


                       <!-- Classes -->

<div
   class="col-span-full rounded-3xl border border-slate-200 bg-white p-6 md:p-5 xl:p-6"
    style="
        box-shadow:
            0 20px 50px rgba(79, 70, 229, 0.12),
            0 8px 24px rgba(124, 58, 237, 0.08);
    ">

    <div
        class="mb-4 flex items-center justify-between">

        <div>

            <p
                class="text-sm text-slate-500">

                Classes

            </p>

        </div>

        <a
    href="/school/classes.html"
    class="rounded-xl border border-slate-200 bg-gradient-to-r from-purple-50 to-indigo-50 px-4 py-2 text-xs font-semibold text-purple-700 transition hover:border-purple-200 hover:shadow-sm">

    Manage

</a>

    </div>

    <div
        id="dashboardClasses"
        class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">

        <p
            class="text-sm text-slate-500">

            Loading classes...

        </p>

    </div>

</div>

                    </div>



    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>
<script src="/js/date.js"></script>
<script src="/js/schoolDashboard.js"></script>


    <script>

        const sidebar =
            document.getElementById(
                "sidebar"
            );

        const sidebarOverlay =
            document.getElementById(
                "sidebarOverlay"
            );

        const mobileMenuBtn =
            document.getElementById(
                "mobileMenuBtn"
            );

        const closeSidebarBtn =
            document.getElementById(
                "closeSidebarBtn"
            );


        function openSidebar() {

            sidebar.classList.remove(
                "-translate-x-full"
            );

            sidebarOverlay.classList.remove(
                "hidden"
            );

        }


        function closeSidebar() {

            sidebar.classList.add(
                "-translate-x-full"
            );

            sidebarOverlay.classList.add(
                "hidden"
            );

        }


        mobileMenuBtn.addEventListener(
            "click",
            openSidebar
        );


        closeSidebarBtn.addEventListener(
            "click",
            closeSidebar
        );


        sidebarOverlay.addEventListener(
            "click",
            closeSidebar
        );


        document
            .querySelectorAll(
                "#sidebar a"
            )
            .forEach(
                link => {

                    link.addEventListener(
                        "click",
                        () => {

                            if (
                                window.innerWidth <
                                768
                            ) {

                                closeSidebar();

                            }

                        }
                    );

                }
            );

    </script>

</body>

</html>
