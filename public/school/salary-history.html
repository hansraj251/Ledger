<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Salary History</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        body {

            background:
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #f5f7ff 50%,
                    #faf7ff 100%
                );

        }


        .premium-header {

            border-bottom:
                1px solid #e0e7ff;

            background:
                rgba(255, 255, 255, 0.96);

            box-shadow:
                0 8px 24px
                rgba(79, 70, 229, 0.07);

            backdrop-filter:
                blur(12px);

        }


        .premium-title {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }


        .premium-btn {

            border:
                1px solid #e0e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            color:
                #4f46a5;

            box-shadow:
                0 4px 12px
                rgba(79, 70, 229, 0.05);

            transition:
                all 0.2s ease;

        }


        .premium-btn:hover {

            background:
                linear-gradient(
                    90deg,
                    #fff7ff 0%,
                    #f5efff 50%,
                    #eef3ff 100%
                );

            color:
                #7b3fc6;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79, 70, 229, 0.10);

        }


        .premium-input {

            border:
                1px solid #ddd6fe;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf7ff
                );

            transition:
                all 0.2s ease;

        }


        .premium-input:focus {

            border-color:
                #8b5cf6;

            outline:
                none;

            box-shadow:
                0 0 0 3px
                rgba(139, 92, 246, 0.12);

        }


        .stat-card {

            border:
                1px solid #e8e5ff;

            box-shadow:
                0 6px 18px
                rgba(79, 70, 229, 0.06);

            transition:
                all 0.2s ease;

        }


        .stat-card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 24px
                rgba(79, 70, 229, 0.10);

        }


        .premium-panel {

            border:
                1px solid #e0e7ff;

            background:
                rgba(255, 255, 255, 0.98);

            box-shadow:
                0 12px 30px
                rgba(79, 70, 229, 0.07);

        }


        .table-header {

            background:
                linear-gradient(
                    90deg,
                    #faf7ff,
                    #f5f7ff
                );

            border-bottom:
                1px solid #ebe8ff;

        }


        .premium-table thead {

            background:
                linear-gradient(
                    90deg,
                    #faf7ff,
                    #f5f7ff
                );

        }


        .premium-table tbody tr {

            border-top:
                1px solid #eef2ff;

            transition:
                background 0.2s ease;

        }


        .premium-table tbody tr:hover {

            background:
                linear-gradient(
                    90deg,
                    #fffaff,
                    #f8f7ff,
                    #f5f7ff
                );

        }

    </style>

</head>


<body class="min-h-screen">


<main class="min-h-screen">


    <!-- Header -->

    <header
        class="premium-header sticky top-0 z-50">

        <div
            class="
                mx-auto
                flex
                w-full
                max-w-7xl
                items-center
                gap-3
                px-4
                py-3
                sm:px-6
                sm:py-4
            ">

            <button
                type="button"
                onclick="history.back()"
                class="
                    premium-btn
                    flex
                    shrink-0
                    items-center
                    gap-2
                    rounded-xl
                    px-3
                    py-2
                    text-sm
                    font-semibold
                    sm:px-4
                    sm:py-2.5
                ">

                <span class="text-lg">

                    ←

                </span>

                Back

            </button>


        </div>

    </header>


    <!-- Content -->

    <div
        class="
            mx-auto
            w-full
            max-w-7xl
            px-4
            py-5
            sm:px-6
            sm:py-8
        ">


        <!-- Heading + Month -->

        <div
            class="
                mb-6
                flex
                flex-col
                gap-5
                md:flex-row
                md:items-end
                md:justify-between
            ">

            <div>

                <h2
                    class="
                        premium-title
                        mt-1
                        text-2xl
                        font-bold
                        sm:text-3xl
                    ">

                    Salary Payment History

                </h2>

            </div>


            <div
                class="w-full md:w-auto">

                <label
                    for="salaryMonth"
                    class="
                        mb-2
                        block
                        text-sm
                        font-semibold
                        text-slate-700
                    ">

                    Salary Month

                </label>

                <input
                    id="salaryMonth"
                    type="month"
                    class="
                        premium-input
                        w-full
                        rounded-xl
                        px-4
                        py-3
                        text-slate-800
                        md:w-auto
                    ">

            </div>

        </div>


        <!-- Summary Cards -->

        <div
            class="
                mb-6
                grid
                gap-4
                sm:grid-cols-2
                md:grid-cols-3
            ">


            <!-- Total Salary -->

            <div
                class="
                    stat-card
                    rounded-2xl
                    bg-white
                    p-5
                ">

                <p
                    class="
                        text-sm
                        font-medium
                        text-slate-500
                    ">

                    Total Salary

                </p>

                <p
                    id="totalSalary"
                    class="
                        mt-2
                        text-2xl
                        font-bold
                        text-slate-800
                    ">

                    ₹0

                </p>

                <p
                    class="
                        mt-2
                        text-xs
                        text-indigo-500
                    ">

                    Salary for selected month

                </p>

            </div>


            <!-- Total Paid -->

            <div
                class="
                    stat-card
                    rounded-2xl
                    border-emerald-200
                    bg-emerald-50/70
                    p-5
                ">

                <p
                    class="
                        text-sm
                        font-medium
                        text-emerald-600
                    ">

                    Total Paid

                </p>

                <p
                    id="totalPaid"
                    class="
                        mt-2
                        text-2xl
                        font-bold
                        text-emerald-700
                    ">

                    ₹0

                </p>

                <p
                    class="
                        mt-2
                        text-xs
                        text-emerald-600
                    ">

                    Completed payments

                </p>

            </div>


            <!-- Transactions -->

            <div
                class="
                    stat-card
                    rounded-2xl
                    border-blue-200
                    bg-blue-50/70
                    p-5
                ">

                <p
                    class="
                        text-sm
                        font-medium
                        text-blue-600
                    ">

                    Transactions

                </p>

                <p
                    id="transactionCount"
                    class="
                        mt-2
                        text-2xl
                        font-bold
                        text-blue-700
                    ">

                    0

                </p>

                <p
                    class="
                        mt-2
                        text-xs
                        text-blue-600
                    ">

                    Payment transactions

                </p>

            </div>

        </div>


        <!-- Payment Records -->

        <div
            class="
                premium-panel
                overflow-hidden
                rounded-2xl
            ">

            <div
                class="
                    table-header
                    px-5
                    py-4
                    sm:px-6
                    sm:py-5
                ">

                

                <h3
                    class="
                        mt-1
                        text-lg
                        font-bold
                        text-slate-800
                    ">

                    Payment Records

                </h3>

                <p
                    class="
                        mt-1
                        text-sm
                        text-slate-500
                    ">

                    Payment history for the selected month.

                </p>

            </div>


            <div
                class="overflow-x-auto">

                <table
                    class="
                        premium-table
                        w-full
                        min-w-[1200px]
                    ">

                    <thead>

                        <tr>

                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Employee

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Staff

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Designation

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-right
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Salary

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-right
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Paid

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Payment Date

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Mode

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Reference

                            </th>


                            <th
                                class="
                                    px-4
                                    py-4
                                    text-left
                                    text-xs
                                    font-semibold
                                    uppercase
                                    tracking-wide
                                    text-indigo-500
                                ">

                                Remarks

                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="salaryHistoryBody">

                        <tr>

                            <td
                                colspan="9"
                                class="
                                    px-4
                                    py-10
                                    text-center
                                    text-sm
                                    text-slate-500
                                ">

                                Loading...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <p
            id="result"
            class="
                mt-4
                text-sm
                font-medium
            ">

        </p>

    </div>

</main>


<script src="/js/api.js"></script>

<script src="/js/auth.js"></script>

<script src="/js/salaryHistory.js"></script>


</body>

</html>
