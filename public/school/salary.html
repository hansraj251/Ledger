<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Salary Management</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #f5f7ff 50%,
                    #faf7ff 100%
                );
        }

        .premium-header {
            border-bottom:
                1px solid #e0e7ff;

            background:
                rgba(255,255,255,0.96);

            box-shadow:
                0 8px 24px
                rgba(79,70,229,0.07);

            backdrop-filter:
                blur(12px);
        }

        .premium-title {
            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;
        }

        .premium-btn {
            border:
                1px solid #e0e7ff;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #faf7ff 50%,
                    #f5f7ff 100%
                );

            color:
                #4f46a5;

            box-shadow:
                0 4px 12px
                rgba(79,70,229,0.05);

            transition:
                all 0.2s ease;
        }

        .premium-btn:hover {
            background:
                linear-gradient(
                    90deg,
                    #fff7ff 0%,
                    #f5efff 50%,
                    #eef3ff 100%
                );

            color:
                #7b3fc6;

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(79,70,229,0.10);
        }

        .premium-panel {
            border:
                1px solid #e0e7ff;

            background:
                rgba(255,255,255,0.98);

            box-shadow:
                0 12px 30px
                rgba(79,70,229,0.07);
        }

        .premium-table thead {
            background:
                linear-gradient(
                    90deg,
                    #faf7ff,
                    #f5f7ff
                );
        }

        .premium-table tbody tr {
            border-top:
                1px solid #eef2ff;

            transition:
                background 0.2s ease;
        }

        .premium-table tbody tr:hover {
            background:
                linear-gradient(
                    90deg,
                    #fffaff,
                    #f8f7ff,
                    #f5f7ff
                );
        }

        .premium-input {
            border:
                1px solid #ddd6fe;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #faf7ff
                );

            transition:
                all 0.2s ease;
        }

        .premium-input:focus {
            border-color:
                #8b5cf6;

            outline:
                none;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.12);
        }

        .salary-summary {
            border:
                1px solid #e8e5ff;

            background:
                linear-gradient(
                    135deg,
                    #faf7ff,
                    #f5f7ff
                );
        }

        .salary-modal {
            border:
                1px solid #e0e7ff;

            box-shadow:
                0 24px 60px
                rgba(49,46,129,0.18);
        }

    </style>

</head>


<body class="min-h-screen bg-slate-100">

<main class="min-h-screen">


    <!-- Header -->

    <header
        class="premium-header sticky top-0 z-50">

        <div
            class="mx-auto flex min-h-[60px] w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:min-h-[72px] sm:px-6 sm:py-4">

            <div
                class="flex items-center gap-4">

                <button
                    type="button"
                    onclick="history.back()"
                    class="premium-btn flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold">

                    <span class="text-lg">
                        ←
                    </span>

                    Back

                </button>

                <div
                    class="hidden h-8 w-px bg-indigo-100 sm:block">
                </div>

            </div>

        </div>

    </header>


    <!-- Main Content -->

    <section
        class="mx-auto w-full max-w-7xl px-4 py-5 sm:px-6 sm:py-8">


        <!-- Page Heading -->

        <div
            class="mb-6">

            <h1
                class="premium-title mt-1 text-2xl font-bold sm:text-3xl">

                Salary Management

            </h1>

        </div>


        <!-- Staff Salary Table -->

        <div
            class="premium-panel overflow-hidden rounded-2xl">

            <div
                class="w-full overflow-x-auto">

                <table
                    class="premium-table min-w-[850px] w-full text-left">

                    <thead>

                        <tr>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Employee ID

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Staff

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Designation

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Basic Salary

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Total Earnings

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Status

                            </th>

                            <th
                                class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4 sm:text-sm">

                                Actions

                            </th>

                        </tr>

                    </thead>

                    <tbody
                        id="salaryStaffTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="px-4 py-10 text-center text-slate-500 sm:px-6">

                                Loading staff...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- Salary Form Modal -->

        <div
            id="salaryForm"
            class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/50 px-3 py-4 backdrop-blur-sm sm:px-4 sm:py-8">

            <div
                class="salary-modal mx-auto w-full max-w-3xl overflow-hidden rounded-2xl bg-white">

                <div
                    class="flex items-center justify-between gap-3 border-b border-slate-200 px-4 py-4 sm:px-6 sm:py-5">

                    <div>

                        <h2
                            id="salaryFormTitle"
                            class="mt-1 text-lg font-semibold text-slate-800 sm:text-xl">

                            Manage Salary

                        </h2>

                    </div>

                    <button
                        type="button"
                        id="closeSalaryFormBtn"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-slate-100">

                        ✕

                    </button>

                </div>


                <form
                    id="salaryFormElement"
                    class="p-4 sm:p-6">

                    <input
                        type="hidden"
                        id="salaryTeacherId">


                    <!-- Staff -->

                    <div
                        class="salary-summary mb-6 rounded-xl p-4">

                        <p
                            id="salaryStaffName"
                            class="font-semibold text-slate-800">

                            -

                        </p>

                        <p
                            id="salaryStaffDesignation"
                            class="mt-1 text-sm text-slate-500">

                            -

                        </p>

                    </div>


                    <!-- Salary Fields -->

                    <div
                        class="grid grid-cols-1 gap-4 sm:gap-5 md:grid-cols-2">


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Basic Salary

                            </label>

                            <input
                                type="number"
                                id="basicSalary"
                                min="0"
                                step="0.01"
                                required
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                HRA

                            </label>

                            <input
                                type="number"
                                id="hra"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Other Allowances

                            </label>

                            <input
                                type="number"
                                id="otherAllowances"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                PF

                            </label>

                            <input
                                type="number"
                                id="pf"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                ESI

                            </label>

                            <input
                                type="number"
                                id="esi"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Professional Tax

                            </label>

                            <input
                                type="number"
                                id="professionalTax"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Other Deductions

                            </label>

                            <input
                                type="number"
                                id="otherDeductions"
                                min="0"
                                step="0.01"
                                value="0"
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>


                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Effective From

                            </label>

                            <input
                                type="date"
                                id="effectiveFrom"
                                required
                                class="premium-input w-full rounded-xl px-4 py-3 outline-none">

                        </div>

                    </div>


                    <!-- Salary Summary -->

                    <div
                        class="salary-summary mt-5 grid grid-cols-1 gap-3 rounded-xl p-4 sm:mt-6 sm:grid-cols-3 sm:gap-4 sm:p-5">

                        <div>

                            <p
                                class="text-xs text-slate-500">

                                Gross Earnings

                            </p>

                            <p
                                id="grossEarnings"
                                class="mt-1 text-lg font-semibold text-slate-800">

                                ₹0

                            </p>

                        </div>


                        <div>

                            <p
                                class="text-xs text-slate-500">

                                Total Deductions

                            </p>

                            <p
                                id="totalDeductions"
                                class="mt-1 text-lg font-semibold text-slate-800">

                                ₹0

                            </p>

                        </div>


                        <div>

                            <p
                                class="text-xs text-slate-500">

                                Net Salary

                            </p>

                            <p
                                id="netSalary"
                                class="mt-1 text-lg font-semibold text-emerald-600">

                                ₹0

                            </p>

                        </div>

                    </div>


                    <!-- Salary History -->

                    <div
                        class="mt-6">

                        <div
                            class="mb-3">

                            <p
                                class="text-sm font-semibold text-slate-800">

                                Salary History

                            </p>

                        </div>


                        <div
                            class="w-full overflow-x-auto rounded-xl border border-slate-200">

                            <table
                                class="min-w-[650px] w-full text-left">

                                <thead
                                    class="bg-slate-50">

                                    <tr>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Effective From

                                        </th>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Basic

                                        </th>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Gross

                                        </th>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Deductions

                                        </th>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Net

                                        </th>

                                        <th
                                            class="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-slate-500">

                                            Status

                                        </th>

                                    </tr>

                                </thead>

                                <tbody
                                    id="salaryHistoryBody">

                                    <tr>

                                        <td
                                            colspan="6"
                                            class="px-4 py-6 text-center text-sm text-slate-500">

                                            No salary history.

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>


                    <p
                        id="salaryFormResult"
                        class="mt-4 text-sm">
                    </p>


                    <!-- Actions -->

                    <div
                        class="mt-5 flex flex-col-reverse gap-3 border-slate-100 pt-5 sm:mt-6 sm:flex-row sm:justify-end">

                        <button
                            type="button"
                            id="cancelSalaryBtn"
                            class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100">

                            Cancel

                        </button>

                        <button
                            type="submit"
                            id="saveSalaryBtn"
                            class="rounded-xl border border-slate-300 px-5 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100">

                            Save Salary

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>


<script
    src="/js/api.js">
</script>

<script
    src="/js/auth.js">
</script>
<script src="/js/notify.js"></script>
<script src="/js/toast.js"></script>
<script
    src="/js/salary.js">
</script>

</body>

</html>
