<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Subscription</title>

<link
    rel="stylesheet"
    href="/css/output.css">
<style>

body {

    background:
        linear-gradient(
            135deg,
            #f8f7ff 0%,
            #f5f7ff 50%,
            #faf7ff 100%
        );

}


/* Header */

header {

    border-color:
        #e0e7ff !important;

    background:
        rgba(255, 255, 255, 0.96) !important;

    box-shadow:
        0 8px 24px
        rgba(79, 70, 229, 0.07) !important;

    backdrop-filter:
        blur(12px);

}


/* Back Button */

header button {

    border-color:
        #ddd6fe !important;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        ) !important;

    color:
        #4f46a5 !important;

    box-shadow:
        0 4px 12px
        rgba(79, 70, 229, 0.05);

}


header button:hover {

    border-color:
        #c4b5fd !important;

    background:
        linear-gradient(
            90deg,
            #fff7ff,
            #f5efff,
            #eef3ff
        ) !important;

    color:
        #7b3fc6 !important;

}


/* Main Subscription Card */

section > div {

    border:
        1px solid
        #e0e7ff;

    background:
        rgba(255, 255, 255, 0.98) !important;

    box-shadow:
        0 12px 30px
        rgba(79, 70, 229, 0.07) !important;

}


/* Page Heading */

section h1 {

    background:
        linear-gradient(
            90deg,
            #c13bbd 0%,
            #7b3fc6 50%,
            #2454c7 100%
        );

    -webkit-background-clip:
        text;

    background-clip:
        text;

    -webkit-text-fill-color:
        transparent;

}


/* Subscription Content */

#subscriptionCard {

    color:
        #334155;

}


/* Common Subscription Cards */

#subscriptionCard > div {

    border-color:
        #e0e7ff !important;

    box-shadow:
        0 8px 22px
        rgba(79, 70, 229, 0.06);

}


/* Hover effect for subscription cards */

#subscriptionCard > div:hover {

    border-color:
        #c4b5fd !important;

    box-shadow:
        0 12px 28px
        rgba(79, 70, 229, 0.10);

}


/* Primary Buttons inside subscription */

#subscriptionCard button {

    background:
        linear-gradient(
            90deg,
            #7b3fc6,
            #2454c7
        );

    box-shadow:
        0 6px 16px
        rgba(79, 70, 229, 0.18);

}


#subscriptionCard button:hover {

    background:
        linear-gradient(
            90deg,
            #7040b8,
            #2454c7
        );

    box-shadow:
        0 9px 22px
        rgba(79, 70, 229, 0.24);

}


/* Links */

#subscriptionCard a {

    color:
        #6d4bc3;

}


#subscriptionCard a:hover {

    color:
        #2454c7;

}


/* Status / Highlight areas */

#subscriptionCard .bg-blue-50 {

    background:
        linear-gradient(
            135deg,
            #f3efff,
            #eef3ff
        ) !important;

}


#subscriptionCard .bg-green-50 {

    background:
        linear-gradient(
            135deg,
            #f0fdf8,
            #f3faff
        ) !important;

}


/* Modal backdrop if subscription opens modal */

#modalContainer .fixed.inset-0 {

    backdrop-filter:
        blur(3px);

}

</style>
</head>

<body class="min-h-screen bg-slate-100">

    <main class="min-h-screen">

        <header
            class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

            <div
                class="mx-auto flex w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 sm:py-4">

                <button
                    type="button"
                    onclick="history.back()"
                    class="flex min-w-[72px] shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-200 sm:min-w-0 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm">

                    <span class="text-base">
                        ←
                    </span>

                    Back

                </button>
                

            </div>
            

        </header>


        <section
            class="mx-auto w-full max-w-7xl px-4 py-4 sm:px-6 sm:py-6 xl:px-8 xl:py-8">

            <div
                class="rounded-2xl bg-white p-5 shadow-sm sm:p-6 lg:p-8">

                <h1
                    class="mb-6 text-2xl font-bold text-slate-800 sm:mb-8 sm:text-3xl">

                    Subscription

                </h1>

                <div
                    id="subscriptionCard">

                    Loading...

                </div>

            </div>

        </section>
        

    </main>


    <div id="modalContainer"></div>


    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/notify.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/components.js"></script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script src="/js/schoolSubscriptionPayment.js"></script>

    <script src="/js/align.js"></script>

    <script src="/js/schoolSubscription.js"></script>

    <script src="/js/modal.js"></script>


    <script>

        loadComponent(
            "modalContainer",
            "/components/modal.html"
        );

    </script>

</body>

</html>
