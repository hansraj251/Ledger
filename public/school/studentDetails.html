<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Students</title>

    <link
        rel="stylesheet"
        href="/css/output.css">
<style>

body {

    background:
        linear-gradient(
            135deg,
            #f8f7ff 0%,
            #f5f7ff 50%,
            #faf7ff 100%
        );

}


/* Header */

header {

    border-color:
        #e0e7ff !important;

    background:
        rgba(255, 255, 255, 0.96) !important;

    box-shadow:
        0 8px 24px
        rgba(79, 70, 229, 0.07) !important;

    backdrop-filter:
        blur(12px);

}


/* Back Button */

header button {

    border-color:
        #ddd6fe !important;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        ) !important;

    color:
        #4f46a5 !important;

    box-shadow:
        0 4px 12px
        rgba(79, 70, 229, 0.05);

}


header button:hover {

    border-color:
        #c4b5fd !important;

    background:
        linear-gradient(
            90deg,
            #fff7ff,
            #f5efff,
            #eef3ff
        ) !important;

    color:
        #7b3fc6 !important;

}


/* Divider */

header .h-8 {

    background:
        #e9e5ff !important;

}


/* Student Summary */

#studentSummary {

    color:
        #6366a8 !important;

}


/* Search */

#studentSearch {

    border-color:
        #ddd6fe !important;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        ) !important;

    color:
        #334155 !important;

    box-shadow:
        0 4px 12px
        rgba(79, 70, 229, 0.04);

}


#studentSearch::placeholder {

    color:
        #94a3b8;

}


#studentSearch:hover {

    border-color:
        #c4b5fd !important;

}


#studentSearch:focus {

    border-color:
        #8b5cf6 !important;

    box-shadow:
        0 0 0 3px
        rgba(139, 92, 246, 0.12) !important;

}


/* Student Cards */

#studentsContainer > div {

    border-color:
        #e0e7ff !important;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #fcfaff 55%,
            #f8f8ff 100%
        ) !important;

    box-shadow:
        0 8px 22px
        rgba(79, 70, 229, 0.06);

    transition:
        all 0.2s ease;

}


#studentsContainer > div:hover {

    border-color:
        #c4b5fd !important;

    box-shadow:
        0 14px 30px
        rgba(79, 70, 229, 0.11);

    transform:
        translateY(-2px);

}


/* Text inside cards */

#studentsContainer h1,
#studentsContainer h2,
#studentsContainer h3 {

    color:
        #334155;

}


#studentsContainer p {

    color:
        #64748b;

}

</style>
</head>

<body class="min-h-screen bg-slate-100">

    <main class="min-h-screen">

        <header
    class="sticky top-0 z-50 border-b border-slate-200 bg-white shadow-sm">

    <div
        class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-3 px-4 py-3 sm:flex-nowrap sm:justify-between sm:px-6 sm:py-4">

        <div
            class="flex min-w-0 shrink-0 items-center gap-2 sm:gap-4">

            <button
                type="button"
                onclick="history.back()"
                class="flex min-w-[72px] shrink-0 items-center justify-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700 transition hover:bg-slate-200 sm:min-w-0 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm">

                <span class="text-base">
                    ←
                </span>

                Back

            </button>

            <div
                class="hidden h-8 w-px bg-slate-200 sm:block">
            </div>

            <div
                class="min-w-0">

                <p
                    id="studentSummary"
                    class="truncate text-xs text-slate-500">

                    Loading students...

                </p>

            </div>

        </div>


        <div
            class="w-full min-w-0 sm:w-auto">

            <label
                for="studentSearch"
                class="sr-only">

                Search student

            </label>

            <input
                id="studentSearch"
                type="search"
                placeholder="Search student..."
                class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100 sm:w-64 sm:px-4">

        </div>

    </div>

</header>


        <section
    class="mx-auto w-full max-w-7xl px-4 py-4 sm:px-6 sm:py-8">


            <div
    id="studentsContainer"
    class="grid grid-cols-1 gap-4 sm:gap-5 md:grid-cols-2 xl:grid-cols-3">

                <div
                    class="rounded-2xl border border-slate-200 bg-white p-6 text-center text-sm text-slate-500">

                    Loading students...

                </div>

            </div>

        </section>

    </main>


    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>

    <script src="/js/studentDetails.js"></script>

</body>

</html>
