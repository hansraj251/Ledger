<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Staff</title>

    <link
        rel="stylesheet"
        href="/css/output.css">
    <style>

body {

    background:
        linear-gradient(
            135deg,
            #f8f7ff 0%,
            #f5f7ff 50%,
            #faf7ff 100%
        );

}


header {

    border-bottom:
        1px solid
        #e0e7ff;

    background:
        rgba(255, 255, 255, 0.96);

    box-shadow:
        0 8px 24px
        rgba(79, 70, 229, 0.07);

    backdrop-filter:
        blur(12px);

}


header a {

    border-color:
        #e0e7ff;

    background:
        linear-gradient(
            90deg,
            #ffffff 0%,
            #faf7ff 50%,
            #f5f7ff 100%
        );

    color:
        #4f46a5;

    box-shadow:
        0 4px 12px
        rgba(79, 70, 229, 0.05);

}


header a:hover {

    border-color:
        #c4b5fd;

    background:
        linear-gradient(
            90deg,
            #fff7ff 0%,
            #f5efff 50%,
            #eef3ff 100%
        );

    color:
        #7b3fc6;

}


header button {

    background:
        linear-gradient(
            90deg,
            #7b3fc6,
            #2454c7
        ) !important;

    box-shadow:
        0 7px 18px
        rgba(79, 70, 229, 0.20);

}


header button:hover {

    background:
        linear-gradient(
            90deg,
            #7040b8,
            #2454c7
        ) !important;

    box-shadow:
        0 10px 24px
        rgba(79, 70, 229, 0.27);

}


#teacherForm,
#designationForm {

    border-color:
        #e0e7ff;

    background:
        rgba(255, 255, 255, 0.97);

    box-shadow:
        0 12px 30px
        rgba(79, 70, 229, 0.07);

}


#teacherForm > div:first-child,
#designationForm > div:first-child {

    border-color:
        #eeeaff;

}


#teacherForm input,
#teacherForm select,
#teacherForm textarea,
#designationForm input {

    border-color:
        #ddd6fe;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #faf7ff
        );

    box-shadow:
        0 3px 10px
        rgba(79, 70, 229, 0.04);

}


#teacherForm input:focus,
#teacherForm select:focus,
#teacherForm textarea:focus,
#designationForm input:focus {

    border-color:
        #8b5cf6;

    box-shadow:
        0 0 0 3px
        rgba(139, 92, 246, 0.12);

    outline:
        none;

}


#teacherForm button[type="submit"],
#designationForm button[type="submit"] {

    background:
        linear-gradient(
            90deg,
            #7b3fc6,
            #2454c7
        );

    border:
        none;

    color:
        white;

    box-shadow:
        0 6px 16px
        rgba(79, 70, 229, 0.18);

}


#teacherForm button[type="submit"]:hover,
#designationForm button[type="submit"]:hover {

    background:
        linear-gradient(
            90deg,
            #7040b8,
            #2454c7
        );

    box-shadow:
        0 9px 20px
        rgba(79, 70, 229, 0.24);

}


#teacherForm button[type="button"],
#designationForm button[type="button"] {

    border-color:
        #e0e7ff;

    background:
        #f8f7ff;

    color:
        #475569;

}


#teacherForm button[type="button"]:hover,
#designationForm button[type="button"]:hover {

    border-color:
        #c4b5fd;

    background:
        #eef3ff;

}


#closeFormBtn,
#closeDesignationBtn {

    background:
        transparent !important;

    color:
        #94a3b8 !important;

    box-shadow:
        none !important;

}


#closeFormBtn:hover,
#closeDesignationBtn:hover {

    background:
        #faf5ff !important;

    color:
        #7b3fc6 !important;

}


main > div:last-of-type {

    border:
        1px solid
        #e0e7ff;

    background:
        rgba(255, 255, 255, 0.98);

    box-shadow:
        0 12px 30px
        rgba(79, 70, 229, 0.07);

}


main > div:last-of-type thead {

    background:
        linear-gradient(
            90deg,
            #faf7ff,
            #f5f7ff
        );

}


main > div:last-of-type thead th {

    color:
        #6366a8;

}


main > div:last-of-type tbody tr {

    border-color:
        #eef2ff;

    transition:
        background 0.2s ease;

}


main > div:last-of-type tbody tr:hover {

    background:
        linear-gradient(
            90deg,
            #fffaff,
            #f8f7ff,
            #f5f7ff
        );

}
#teacherForm,
#designationForm {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(5px);
}

#teacherForm:not(.hidden),
#designationForm:not(.hidden) {
    display: flex;
}

#teacherForm > .staff-modal-content,
#designationForm > .designation-modal-content {
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 1rem;
}

#teacherForm > .staff-modal-content {
    max-width: 900px;
}

#designationForm > .designation-modal-content {
    max-width: 600px;
}

@media (max-width: 640px) {

    #teacherForm,
    #designationForm {
        padding: 0.75rem;
    }

    #teacherForm > .staff-modal-content,
    #designationForm > .designation-modal-content {
        max-height: 92vh;
    }

}

</style>    

</head>

<body class="min-h-screen bg-slate-100">

    <div class="min-h-screen">

       <header
    class="sticky top-0 z-50 border-slate-200 bg-white shadow-sm">

    <div
        class="mx-auto flex min-h-[60px] w-full max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:min-h-[72px] sm:px-6 sm:py-4">

        <a
            href="/school/dashboard.html"
            class="flex shrink-0 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-200 sm:px-4 sm:py-2.5">

            <span class="text-lg">
                ←
            </span>

            Back

        </a>

        <div
    class="flex shrink-0 items-center gap-1.5 sm:gap-3">

            <button
                id="addDesignationBtn"
                type="button"
                class="rounded-xl bg-blue-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 sm:px-4 sm:py-2.5">

                + Add Designation

            </button>

            <button
                id="addTeacherBtn"
                type="button"
                class="rounded-xl bg-blue-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 sm:px-4 sm:py-2.5">

                + Add Staff

            </button>
            <a
    href="/school/attendance-users.html"
    data-page="attendance-users"
    class="rounded-xl bg-blue-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-blue-700 sm:px-4 sm:py-2.5">

    Attendance Users

</a>

        </div>

    </div>

</header>

        <main
    class="mx-auto w-full max-w-7xl px-4 py-5 sm:px-6 sm:py-8">

            <div
    id="teacherForm"
    class="hidden">

    <div
        class="staff-modal-content rounded-2xl border border-slate-200 bg-white p-4 shadow-2xl sm:p-6">
                <div
    class="mb-5 flex items-center justify-between border-slate-100 pb-4 sm:mb-6">

                    <div>

                        <h3
                            id="teacherFormTitle"
                            class="min-w-0 text-lg font-semibold text-slate-800 sm:text-xl">

                            Add Staff

                        </h3>

                        <p
                            class="mt-1 text-sm text-slate-500">

                            Enter staff details.

                        </p>

                    </div>

                    <button
                        id="closeFormBtn"
                        type="button"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-2xl leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                        ×

                    </button>

                </div>

                <form
                    id="teacherFormElement">

                    <div
    class="grid grid-cols-1 gap-4 sm:gap-5 md:grid-cols-2">

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Employee ID

                            </label>

                            <input
                                id="employeeId"
                                type="text"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Staff Name

                            </label>

                            <input
                                id="teacherName"
                                type="text"
                                required
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Designation

                            </label>

                            <select
                                id="designation"
                                required
                                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                                <option value="">
                                    Select designation
                                </option>

                            </select>

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Father's Name

                            </label>

                            <input
                                id="fatherName"
                                type="text"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Mother's Name

                            </label>

                            <input
                                id="motherName"
                                type="text"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Date of Birth

                            </label>

                            <input
                                id="dob"
                                type="date"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Gender

                            </label>

                            <select
                                id="gender"
                                class="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                                <option value="">
                                    Select gender
                                </option>

                                <option value="male">
                                    Male
                                </option>

                                <option value="female">
                                    Female
                                </option>

                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Mobile

                            </label>

                            <input
                                id="mobile"
                                type="tel"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Email

                            </label>

                            <input
                                id="email"
                                type="email"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Qualification

                            </label>

                            <input
                                id="qualification"
                                type="text"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Subject

                            </label>

                            <input
                                id="subject"
                                type="text"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div>

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Joining Date

                            </label>

                            <input
                                id="joiningDate"
                                type="date"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                        </div>

                        <div
                            class="md:col-span-2">

                            <label
                                class="mb-2 block text-sm font-medium text-slate-700">

                                Address

                            </label>

                            <textarea
                                id="address"
                                rows="3"
                                class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"></textarea>

                        </div>

                    </div>

                    <div
                            class="mt-5 flex flex-col-reverse gap-3 border-slate-100 pt-5 sm:flex-row sm:justify-end">

                        <button
                            type="submit"
                            class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-200 sm:w-auto">

                            Save Staff

                        </button>

                        <button
                            id="cancelTeacherBtn"
                            type="button"
                            class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-200 sm:w-auto">

                            Cancel

                        </button>

                    </div>

                    <p
                        id="formResult"
                        class="mt-4 text-sm font-medium">

                    </p>

                </form>
                </div>

            </div>

            <div
    id="designationForm"
    class="hidden">

    <div
        class="designation-modal-content rounded-2xl border border-slate-200 bg-white p-4 shadow-2xl sm:p-6">
                <div
    class="mb-5 flex items-center justify-between border-b border-slate-100 pb-4">

                    <div>

                        <h3
                            class="text-xl font-semibold text-slate-800">

                            Add Designation

                        </h3>

                        <p
                            class="mt-1 text-sm text-slate-500">

                            Create a designation that can be assigned to staff.

                        </p>

                    </div>

                    <button
                        id="closeDesignationBtn"
                        type="button"
                        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-2xl leading-none text-slate-400 transition hover:bg-slate-100 hover:text-slate-700">

                        ×

                    </button>

                </div>

                <form
    id="designationFormElement"
    class="flex flex-col gap-4 sm:flex-row sm:items-end">

                    <div
                        class="flex-1">

                        <label
                            class="mb-2 block text-sm font-medium text-slate-700">

                            Designation

                        </label>

                        <input
                            id="designationName"
                            type="text"
                            required
                            placeholder="e.g. Principal"
                            class="w-full rounded-lg border border-slate-300 px-4 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">

                    </div>

                    <button
                        type="submit"
                        class="w-full rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700 sm:w-auto">

                        Save Designation

                    </button>

                    <button
                        id="cancelDesignationBtn"
                        type="button"
                        class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-200 sm:w-auto">

                        Cancel

                    </button>

                </form>

                <p
                    id="designationResult"
                    class="mt-4 text-sm font-medium">

                </p>

            </div>
            </div>

           <div
    class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

                <div
    class="w-full overflow-x-auto">

                    <table
    class="min-w-[900px] w-full text-left">

                        <thead
                            class="border-b bg-slate-50">

                            <tr>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Employee ID

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Name

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Designation

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Qualification

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Mobile

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Joining Date

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Status

                                </th>

                                <th
                                    class="whitespace-nowrap px-3 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 sm:px-6 sm:py-4">

                                    Actions

                                </th>

                            </tr>

                        </thead>

                        <tbody
                            id="teachersTableBody"
                            class="divide-y divide-slate-100">

                            <tr>

                                <td
                                    colspan="8"
                                    class="px-4 py-10 text-center text-slate-500 sm:px-6">

                                    Loading staff...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>
<div id="modalContainer"></div>
    </div>

    <script src="/js/api.js"></script>

    <script src="/js/auth.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/modal.js"></script>

<script>

loadComponent(
    "modalContainer",
    "/components/modal.html"
);

</script>

    <script src="/js/teachers.js"></script>

</body>

</html>
