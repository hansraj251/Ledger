<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Align Super Admin</title>

    <link
        rel="stylesheet"
        href="/css/output.css">

    <style>

        .super-stat-card {

            border-color:
                #e5e7eb;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #faf7ff 55%,
                    #f5f7ff 100%
                );

            box-shadow:
                0 12px 30px
                rgba(79, 70, 229, 0.08),
                0 4px 12px
                rgba(124, 58, 237, 0.05);

            transition:
                all 0.2s ease;

        }

        .super-stat-card:hover {

            border-color:
                #c4b5fd;

            background:
                linear-gradient(
                    135deg,
                    #fffaff 0%,
                    #f7f0ff 55%,
                    #eef3ff 100%
                );

            transform:
                translateY(-3px);

            box-shadow:
                0 18px 35px
                rgba(79, 70, 229, 0.13),
                0 6px 16px
                rgba(124, 58, 237, 0.08);

        }

        .super-stat-number {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            -webkit-background-clip:
                text;

            background-clip:
                text;

            -webkit-text-fill-color:
                transparent;

            color:
                transparent;

        }

        .super-panel {

            border-color:
                #e5e7eb;

            background:
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #faf7ff 55%,
                    #f5f7ff 100%
                );

            box-shadow:
                0 12px 30px
                rgba(79, 70, 229, 0.08),
                0 4px 12px
                rgba(124, 58, 237, 0.05);

        }

        .super-primary-btn {

            background:
                linear-gradient(
                    90deg,
                    #c13bbd 0%,
                    #7b3fc6 50%,
                    #2454c7 100%
                );

            box-shadow:
                0 6px 16px
                rgba(79, 70, 229, 0.15);

            transition:
                all 0.2s ease;

        }

        .super-primary-btn:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(79, 70, 229, 0.20);

        }

    </style>

</head>

<body class="min-h-screen bg-slate-100">

<script src="/js/components.js"></script>
<script src="/js/superAdminAuth.js"></script>
<script src="/js/superAdminLayout.js"></script>
<script src="/js/notify.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/superAdminDashboard.js"></script>

<script>

loadSuperAdminLayout({

    title: "Dashboard",

    active: "dashboard"

});

document.getElementById("pageContent").innerHTML = `

<div class="space-y-6">

    <div class="grid grid-cols-1 gap-6 md:grid-cols-4">

    <div
        class="
            super-stat-card
            rounded-2xl
            border
            p-6
        ">

        <div
            class="text-sm font-medium text-slate-500">

            Total Restaurants

        </div>

        <div
            id="totalRestaurants"
            class="
                super-stat-number
                mt-3
                text-4xl
                font-bold
            ">

            0

        </div>

    </div>


    <div
        class="
            super-stat-card
            rounded-2xl
            border
            p-6
        ">

        <div
            class="text-sm font-medium text-slate-500">

            Total Schools

        </div>

        <div
            id="totalSchools"
            class="
                super-stat-number
                mt-3
                text-4xl
                font-bold
            ">

            0

        </div>

    </div>

</div>


    <div
        class="
            super-panel
            rounded-2xl
            border
            p-6
        ">

        <div
            class="
                flex
                flex-col
                gap-4
                sm:flex-row
                sm:items-center
                sm:justify-between
            ">

            <div>

                <h2
                    class="
                        text-lg
                        font-semibold
                        text-slate-800
                    ">

                    Database Backup

                </h2>

                <p
                    class="
                        mt-1
                        text-sm
                        text-slate-500
                    ">

                    Download the latest database backup.

                </p>

            </div>


            <button
                id="downloadBackupBtn"
                class="
                    super-primary-btn
                    inline-flex
                    items-center
                    justify-center
                    gap-2
                    rounded-xl
                    px-5
                    py-2.5
                    text-sm
                    font-semibold
                    text-white
                ">

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 4v10m0 0l-4-4m4 4l4-4M5 20h14"/>

                </svg>

                <span>

                    Download Backup

                </span>

            </button>

        </div>

    </div>

</div>

`;

document
    .getElementById(
        "downloadBackupBtn"
    )
    .addEventListener(

        "click",

        async () => {

            try {

                const response =
                    await fetch(

                        "/api/super-admin/backup",

                        {

                            headers: {

                                Authorization:
                                    `Bearer ${SuperAdminAuth.token()}`

                            }

                        }

                    );

                if (!response.ok) {

                    throw new Error(
                        "Backup download failed."
                    );

                }

                const blob =
                    await response.blob();

                const url =
                    window.URL.createObjectURL(
                        blob
                    );

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.download =
                    "align-backup.zip";

                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();

                window.URL.revokeObjectURL(
                    url
                );

            } catch (err) {

                Notify.error(
                    err.message
                );

            }

        }

    );

loadDashboard();

</script>

</body>

</html>
